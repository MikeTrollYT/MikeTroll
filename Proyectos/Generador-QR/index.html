<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Generador de Códigos QR</h1>
        <form onsubmit="generarQR(event)">
            <label for="url">Ingrese la URL:</label>
            <input type="url" id="url" placeholder="https://example.com" required>
            <button type="submit">Generar QR</button>
        </form>

        <p id="qrError" role="alert" hidden></p>

        <div id="qrResult" hidden>
            <div id="qr"></div>
            <button type="button" id="downloadBtn" class="secondary" onclick="descargarQR()">Descargar PNG</button>
        </div>
    </main>

    <footer>
        © 2024 Generador de QR - Desarrollado con ❤️ por MikeTrollYT
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

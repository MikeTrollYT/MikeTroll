<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor IPTV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Formulario de carga inicial -->
<div id="loadContainer">
    <h2>Reproductor IPTV Online</h2>
    <input type="text" id="m3uUrl" class="form-control" aria-label="URL de la lista" placeholder="Inserte una URL .m3u8" value="https://raw.githubusercontent.com/MikeTrollYT/MikeTroll/refs/heads/main/Proyectos/IPTV/lista.m3u8">
    <p id="loadError" role="alert" hidden></p>
    <button id="loadBtn" class="btn btn-primary" onclick="loadM3U()">Cargar Lista</button>
</div>

<!-- Aplicación -->
<div class="container-fluid" id="appContainer">
    <!-- Reproductor -->
    <section class="player-column">
        <h1 id="nowPlaying">Reproductor IPTV</h1>
        <div id="playerContainer">
            <video id="iptvPlayer" controls playsinline></video>
            <p id="playerStatus">Elige un canal de la lista.</p>
        </div>
    </section>

    <!-- Canales (panel oscuro) -->
    <aside class="channels-column">
        <div class="panel-head">
            <h2>Canales</h2>
            <span id="channelCount"></span>
        </div>
        <input type="search" class="search-bar" placeholder="Buscar canal..." id="searchInput" aria-label="Buscar canal" oninput="searchChannel()">
        <div id="channelsList"></div>
        <p id="noResults" hidden>Ningún canal coincide.</p>
        <button type="button" class="change-list" onclick="showLoader()">Cambiar lista</button>
    </aside>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script src="script.js"></script>
</body>
</html>

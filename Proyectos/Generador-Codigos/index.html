<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="config-section">
            <h1>Generador de Códigos</h1>
            <h2>Configuración</h2>
            <form id="configForm" novalidate>
                <div class="field wide">
                    <label for="exclude">Caracteres no permitidos:</label>
                    <input type="text" id="exclude" placeholder="Ejemplo: P,1,6,A" autocomplete="off">
                </div>

                <div class="field">
                    <label for="length">Longitud del código:</label>
                    <input type="number" id="length" min="1" max="256" placeholder="Ejemplo: 12">
                </div>

                <div class="field">
                    <label for="count">Cantidad de códigos:</label>
                    <input type="number" id="count" min="1" max="10000" placeholder="Ejemplo: 10">
                </div>

                <div class="field">
                    <label for="delimiter">Delimitador:</label>
                    <input type="text" id="delimiter" maxlength="1" placeholder="Ejemplo: -" autocomplete="off">
                </div>

                <div class="field">
                    <label for="delimiterEvery">Cada cuántos dígitos se coloca el delimitador:</label>
                    <input type="number" id="delimiterEvery" min="1" placeholder="Ejemplo: 4">
                </div>

                <div class="field wide">
                    <label for="case">Formato de mayúsculas/minúsculas:</label>
                    <select id="case">
                        <option value="both">Ambos</option>
                        <option value="uppercase">Solo mayúsculas</option>
                        <option value="lowercase">Solo minúsculas</option>
                    </select>
                </div>

                <button id="generate" type="submit" class="primary wide">Generar</button>
            </form>
            <p id="message" role="status"></p>
        </section>

        <aside class="result-section">
            <h2>Códigos Generados</h2>
            <textarea id="output" readonly aria-label="Códigos generados"></textarea>
            <div class="actions">
                <button type="button" id="copy" class="primary" disabled>Copiar</button>
                <button type="button" id="download" class="ghost" disabled>Descargar .txt</button>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
